<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팝업·박람회·행사 보드</title>
<meta name="description" content="서울·경기 팝업스토어·박람회·문화행사와 전국 주목 행사를 하루 두 번 모아 보여줍니다.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ticket-stub list — date stub on the left, details on the right; filters stick to the top */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --fg:#1d1f24; --muted:#6b6e76; --line:#dedcd5;
  --accent:#e2462f; --accent-soft:#fde6e1;
  --popup:#d6336c; --expo:#2b6cb0; --culture:#2f855a;
  --warn:#b7791f; --warn-soft:#fdf2dc;
  --f-display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16171a; --surface:#202227; --fg:#ecebe7; --muted:#9a9ca3; --line:#33363d;
  --accent:#ff6a52; --accent-soft:#3a2420;
  --popup:#f06595; --expo:#63a4ea; --culture:#5cc08a;
  --warn:#f0b54d; --warn-soft:#3a2f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16171a; --surface:#202227; --fg:#ecebe7; --muted:#9a9ca3; --line:#33363d;
  --accent:#ff6a52; --accent-soft:#3a2420;
  --popup:#f06595; --expo:#63a4ea; --culture:#5cc08a;
  --warn:#f0b54d; --warn-soft:#3a2f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px}
header h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:13px}
header p b{color:var(--fg);font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-top:14px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* collapsible filter header */
.ftoggle-row{display:flex;align-items:center;gap:8px}
.ftoggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:inherit;background:transparent;border:0;padding:4px 0;color:var(--fg);cursor:pointer;text-align:left}
.ftoggle:focus-visible,.freset:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ft-label{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.06em}
.ft-sum{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-sum b{color:var(--fg);font-weight:700}
.ft-count{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ft-caret{flex:0 0 auto;width:7px;height:7px;margin:0 4px 3px 2px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.ftoggle[aria-expanded="true"] .ft-caret{transform:rotate(-135deg);margin-bottom:-3px}
.freset{flex:0 0 auto;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer}
.fpanel{display:flex;flex-direction:column;gap:8px}
.bar.collapsed{padding-block:10px 8px;gap:4px}
@media (prefers-reduced-motion:reduce){.ft-caret{transition:none}}
/* filter rows: label on the left, a distinct shape per group */
.frow{display:flex;align-items:flex-start;gap:10px}
.flabel{flex:0 0 34px;padding-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.frow .chips{flex:1;min-width:0}
/* 유형: round pills, filled when on */
.chips.type .chip{border-radius:999px}
.chips.type .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* 지역: squared tabs with a pin mark, accent outline when on */
.chips.place .chip{border-radius:6px;background:transparent}
.chips.place .chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.chips.place .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chips.place .chip[aria-pressed="true"]::before{background:var(--accent)}
.chips.place.sub .chip{font-size:12px;padding:3px 9px}
/* 분야: hashtag-style text chips, underlined when on */
.chips.theme{gap:4px 12px}
.chips.theme .chip{border:0;background:transparent;border-radius:0;padding:4px 0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.chips.theme .chip::before{content:"#";margin-right:1px;opacity:.6}
.chips.theme .chip[data-theme="all"]::before{content:""}
.chips.theme .chip[aria-pressed="true"]{background:transparent;color:var(--fg);border-bottom-color:var(--fg)}
.tag.theme{background:transparent;color:var(--muted);padding-left:0}
/* 보기: checkbox-style toggles */
.chips.view .chip{border:0;background:transparent;padding:4px 2px;font-weight:600;color:var(--muted)}
.chips.view .chip::before{content:"";display:inline-block;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;margin-right:6px;vertical-align:-2px}
.chips.view .chip[aria-pressed="true"]{background:transparent;color:var(--fg)}
.chips.view .chip[aria-pressed="true"]::before{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--bg)}
.chips.view{gap:14px}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.status{font-size:12px;color:var(--muted);min-height:1em}
.section-h{font-family:var(--f-display);font-weight:400;font-size:20px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
.section-h small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:76px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stub{border-right:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;text-align:center;gap:2px}
.stub .m{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.stub .d{font-family:var(--f-display);font-size:30px;line-height:1}
.stub .w{font-size:11px;color:var(--muted)}
.ev[data-cat="popup"] .stub .d{color:var(--popup)}
.ev[data-cat="expo"] .stub .d{color:var(--expo)}
.ev[data-cat="culture"] .stub .d{color:var(--culture)}
.body{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);letter-spacing:.02em}
.tag.cat-popup{color:var(--popup)} .tag.cat-expo{color:var(--expo)} .tag.cat-culture{color:var(--culture)}
.tag.new{background:var(--accent);color:#fff}
.tag.far{background:var(--accent-soft);color:var(--accent)}
.tag.store{background:transparent;color:var(--popup);border:1px solid var(--popup);padding:1px 6px}
.tag.home{background:var(--culture);color:var(--surface)}
.tag.live{background:var(--fg);color:var(--bg)}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.ev h3{margin:0;font-size:16px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.meta span{font-variant-numeric:tabular-nums}
.sum{margin:0;font-size:14px;overflow-wrap:anywhere}
.rsv{font-size:13px;background:var(--warn-soft);color:var(--fg);border-radius:6px;padding:6px 9px;overflow-wrap:anywhere}
.rsv b{color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.ev a.book{background:var(--accent);color:#fff;padding:5px 11px;border-radius:6px}
.ev a.book:hover{text-decoration:none;filter:brightness(1.08)}
.ev a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;align-self:flex-start}
.ev a:hover{text-decoration:underline}
.ev a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ev.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (max-width:420px){.ev{grid-template-columns:62px 1fr}.stub .d{font-size:26px}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>팝업·박람회·행사 보드</h1>
    <p>팝업스토어 · 박람회·전시 · 문화·페스티벌. 서울·경기 전체와 그 외 지역의 주목할 만한 행사가 하루 두 번(07:47 · 14:47) 자동으로 모입니다. <b id="lastUpd"></b></p>
  </header>

  <div class="bar">
    <div class="ftoggle-row">
      <button class="ftoggle" id="fToggle" type="button" aria-expanded="true" aria-controls="fPanel">
        <span class="ft-label">필터</span><span class="ft-sum" id="fSummary">전체</span><span class="ft-count" id="fCount"></span><span class="ft-caret" aria-hidden="true"></span>
      </button>
      <button class="freset" id="fReset" type="button" hidden>초기화</button>
    </div>
    <div class="fpanel" id="fPanel">
    <div class="frow"><span class="flabel">유형</span>
    <div class="chips type" role="group" aria-label="유형">
      <button class="chip" id="c-all" data-cat="all" aria-pressed="true">전체<span class="n" id="n-all"></span></button>
      <button class="chip" id="c-popup" data-cat="popup" aria-pressed="false">팝업<span class="n" id="n-popup"></span></button>
      <button class="chip" id="c-expo" data-cat="expo" aria-pressed="false">박람회 및 전시<span class="n" id="n-expo"></span></button>
      <button class="chip" id="c-culture" data-cat="culture" aria-pressed="false">문화 및 페스티벌<span class="n" id="n-culture"></span></button>
    </div>
    </div>
    <div class="frow"><span class="flabel">분야</span>
    <div class="chips theme" role="group" aria-label="분야" id="themes"></div>
    </div>
    <div class="frow"><span class="flabel">지역</span>
    <div class="chips place" role="group" aria-label="지역">
      <button class="chip" id="r-all" data-region="all" aria-pressed="true">전체<span class="n" id="n-r-all"></span></button>
      <button class="chip" id="r-seoul" data-region="seoul" aria-pressed="false">서울<span class="n" id="n-seoul"></span></button>
      <button class="chip" id="r-gyeonggi" data-region="gyeonggi" aria-pressed="false">경기도<span class="n" id="n-gyeonggi"></span></button>
      <button class="chip" id="r-home" data-region="home" aria-pressed="false">성남·광주·용인<span class="n" id="n-home"></span></button>
      <button class="chip" id="r-national" data-region="national" aria-pressed="false">그 외 지역<span class="n" id="n-national"></span></button>
    </div>
    </div>
    <div class="frow" id="districtRow" hidden><span class="flabel">서울</span>
    <div class="chips place sub" role="group" aria-label="서울 세부 지역" id="districts"></div>
    </div>
    <div class="frow"><span class="flabel">보기</span>
    <div class="chips view" role="group" aria-label="보기">
      <button class="chip" id="v-new" data-view="new" aria-pressed="false">새로 추가된 것만</button>
      <button class="chip" id="v-rsv" data-view="rsv" aria-pressed="false">사전예약 있는 것만</button>
    </div>
    </div>
    </div>
    <div class="status" id="status">불러오는 중…</div>
  </div>

  <main id="main">
    <div class="empty"><strong>아직 모인 행사가 없어요</strong>정기 알림이 실행될 때마다 찾은 행사가 여기에 쌓입니다.</div>
  </main>

  <footer>끝난 행사는 자동으로 숨겨집니다. 날짜·장소는 꼭 공식 채널에서 한 번 더 확인하세요.</footer>
</div>

<script>
(function(){
  const CAT = {popup:"팝업", expo:"박람회·전시", culture:"문화·페스티벌"};
  const WD = ["일","월","화","수","목","금","토"];
  let all = [], cat = "all", region = "all", district = "all", theme = "all", onlyNew = false, onlyRsv = false;
  const scopeOf = e => e.scope === "national" ? "national" : "local";
  const HOME_RE = /성남|분당|판교|수정구|중원구|정자|서현|야탑|모란|위례|광주시|광주 |곤지암|오포|퇴촌|초월|도척|남한산성|화담숲|용인|수지|기흥|처인|동백|죽전|보정|에버랜드/;
  const GG_RE = /성남|분당|판교|광주|곤지암|용인|수지|기흥|처인|하남|고양|일산|킨텍스|수원|파주|부천|안양|과천|광명|남양주|구리|의정부|화성|동탄|평택|시흥|김포|안산|군포|의왕|이천|여주|양평|가평|포천|양주|오산|안성/;
  /* Seoul districts, in display order; first match wins */
  const DISTRICTS = [
    ["성수", /성수|서울숲|뚝섬/],
    ["홍대·연남", /홍대|연남|합정|망원|상수/],
    ["용산·한남", /용산|한남|이태원|해방촌|아이파크몰/],
    ["여의도·영등포", /여의도|더현대|IFC|영등포|타임스퀘어|문래/],
    ["잠실", /잠실|롯데월드|송파|석촌/],
    ["삼성·코엑스", /삼성동|코엑스|대치|세텍|SETEC|봉은사/],
    ["강남·서초", /강남|신사|압구정|도산|청담|가로수|반포|서초|양재|논현|역삼|aT센터/],
    ["종로·광화문", /종로|광화문|청계|인사동|익선|북촌|서촌|을지로|명동|DDP|동대문|성북|혜화|대학로/],
  ];
  const textOf = e => (e.area||"")+" "+(e.venue||"");
  const isHome = e => e.home === true || (scopeOf(e)==="local" && HOME_RE.test(textOf(e)));
  function regionOf(e){
    if(e.region === "seoul" || e.region === "gyeonggi" || e.region === "national") return e.region;
    if(scopeOf(e)==="national") return "national";
    if(isHome(e)) return "gyeonggi";
    const t = textOf(e);
    if(GG_RE.test(e.area||"")) return "gyeonggi";
    if(/인천/.test(t)) return "national";
    return "seoul";
  }
  function districtOf(e){
    if(regionOf(e)!=="seoul") return "";
    if(e.district && DISTRICTS.some(d=>d[0]===e.district)) return e.district;
    const t = textOf(e);
    for(const [name, re] of DISTRICTS) if(re.test(t)) return name;
    return "기타 서울";
  }
  /* 분야 (theme). Match order resolves overlaps; title is checked before summary. */
  const THEMES = [
    ["캐릭터·애니", /캐릭터|애니|짱구|산리오|포켓몬|코난|주술회전|쿠로코|봇치|명일방주|아크나이츠|드래곤볼|카드캡터|러브라이브|에반게리온|스누피|태권\s?V|태권브이|PEACH-PIT|피치피트|핫토이|피규어|레고|AGF|웹툰|만화|애니메이트|해리포터|조이프렌즈|조앤프렌즈|카카오프렌즈|디즈니|마블|원피스|나루토|헬로키티|시나모롤|쿠로미|가차|가챠|재혼황후|타네무라/i],
    ["게임", /게임|지스타|G-STAR|스위치|닌텐도|니케|e스포츠|월즈|Worlds|라이엇|PlayStation|플레이스테이션|넥슨|넷마블|보드게임/i],
    ["뷰티", /뷰티|화장품|코스메틱|롬앤|레티놀|스킨케어|향수|퍼퓸|Parfum|올리브영|메이크업|바이탈뷰티|에이피 뷰티|리바이포유|오푸리스|립스틱|쿠션|네일|헤어|그립비/i],
    ["푸드·디저트", /푸드|디저트|카페쇼|커피|빵|베이커리|피자|김밥|국밥|맛집|빼빼로|스위트파크|먹거리|식품|위스키|캐스크|와인|주류|맥주|밀크티|초콜릿|쿠키|케이크|도넛|라면|떡볶이|과자|사과축제|바게트|미니도우/],
    ["패션", /패션|의류|아우터|슈즈|스니커즈|챔피온|코치|무신사 스토어|베어파우|노스페이스|던스트|에쿠아|프리버|에세이즈|EQL|가방|주얼리|안경|아이웨어|룩북|실리언/],
    ["음악·공연", /콘서트|음악|뮤직|뮤지컬|오페라|오케스트라|필하모|재즈|악극|발레|합창|밴드|레코드|스포티파이|Spotify|리사이틀|자우림|어서옵SHOW|주현미|아이돌|예술인|보이넥스트도어|디페스타|DFESTA|공연/i],
    ["아트·디자인", /전시|아트|미술|디자인|건축|일러스트|사진전|갤러리|공예|그림책|콘텐츠/],
    ["축제·마켓", /축제|페스타|페스티벌|festival|마켓|불꽃|빛|장터|플리|마실|걷기|올레|단풍|H빌리지/i],
    ["라이프·리빙", /리빙|인테리어|여행|트래블|베이비|육아|유아|반려|펫|동물|메가주|웨딩|캠핑|가전|파나소닉|LG|문구|레일|아카이브|모터스튜디오|자동차/],
  ];
  /* display order of the filter chips */
  const THEME_NAMES = ["뷰티","패션","푸드·디저트","캐릭터·애니","게임","음악·공연","아트·디자인","축제·마켓","라이프·리빙","기타"];
  function themeOf(e){
    if(e.theme && THEME_NAMES.includes(e.theme)) return e.theme;
    const title = e.title||"";
    for(const [name, re] of THEMES) if(re.test(title)) return name;
    const rest = (e.summary||"")+" "+(e.venue||"");
    for(const [name, re] of THEMES) if(re.test(rest)) return name;
    return "기타";
  }
  const inReg = (e, r) => r==="all" || (r==="home" ? isHome(e) : regionOf(e)===r);
  const inDist = e => region!=="seoul" || district==="all" || districtOf(e)===district;

  function todayKST(){
    const d = new Date(Date.now() + 9*3600e3);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/864e5); }
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtShort(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${+m}.${+d}`; }
  function isNew(e){ const t = Date.parse(e.firstSeen||""); return !isNaN(t) && Date.now()-t < 24*3600e3; }
  function safeUrl(u){ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:""; }catch(_){ return ""; } }

  function card(e, today){
    const start = e.start||"", end = e.end||e.start||"";
    const live = start && start<=today && end>=today;
    const dd = start>today ? daysBetween(today,start) : null;
    let m="", d="?", w="";
    const show = live ? today : start;
    if(show){ const [y,mm,dd2]=show.split("-"); m=`${+mm}월`; d=+dd2; w=WD[new Date(show+"T00:00:00Z").getUTCDay()]+(live?" · 오늘":""); }
    const tags = [`<span class="tag cat-${esc(e.category)}">${esc(CAT[e.category]||"기타")}</span>`];
    if(themeOf(e)!=="기타") tags.push(`<span class="tag theme">#${esc(themeOf(e))}</span>`);
    if(scopeOf(e)==="national") tags.push(`<span class="tag far">${esc(e.area||"지방")}</span>`);
    else if(isHome(e)) tags.push(`<span class="tag home">우리 동네 · ${esc(e.area||"")}</span>`);
    else if(regionOf(e)==="seoul") tags.push(`<span class="tag">${esc(districtOf(e))}</span>`);
    else tags.push(`<span class="tag">경기 · ${esc(e.area||"")}</span>`);
    if(e.eventType==="store") tags.push(`<span class="tag store">매장 이벤트</span>`);
    if(isNew(e)) tags.push(`<span class="tag new">NEW</span>`);
    if(live) tags.push(`<span class="tag live">진행 중</span>`);
    else if(dd!==null) tags.push(`<span class="tag">D-${dd}</span>`);
    if(e.reservationOpen && e.reservationOpen.slice(0,10)>=today) tags.push(`<span class="tag soon">예약 오픈 ${esc(fmtShort(e.reservationOpen.slice(0,10)))}${e.reservationOpen.length>10?" "+esc(e.reservationOpen.slice(11,16)):""}</span>`);
    const period = !start ? "기간 확인 필요" : e.endTBD ? `${fmtShort(start)} – 종료일 미정` : (end && end!==start ? `${fmtShort(start)} – ${fmtShort(end)}` : fmtShort(start));
    const url = safeUrl(e.url);
    const rurl = safeUrl(e.reservationUrl||"");
    return `<article class="ev${e.highlight?" hl":""}" data-cat="${esc(e.category)}">
      <div class="stub"><span class="m">${esc(m)}</span><span class="d">${esc(d)}</span><span class="w">${esc(w)}</span></div>
      <div class="body">
        <div class="tags">${tags.join("")}</div>
        <h3>${esc(e.title)}</h3>
        <div class="meta"><span>${esc(period)}</span><span>${esc(e.venue||"장소 확인 필요")}${e.area?" · "+esc(e.area):""}</span></div>
        ${e.summary?`<p class="sum">${esc(e.summary)}</p>`:""}
        ${e.reservation?`<div class="rsv"><b>예약</b> ${esc(e.reservation)}</div>`:""}
        <div class="links">${rurl?`<a class="book" href="${esc(rurl)}" target="_blank" rel="noopener">예약하기 →</a>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">출처 보기 →</a>`:""}</div>
      </div></article>`;
  }

  function render(){
    const today = todayKST();
    const active = all.filter(e => (e.end||e.start||"9999") >= today);
    const inTheme = e => theme==="all" || themeOf(e)===theme;
    const inRegion = active.filter(e => inReg(e, region) && inDist(e) && inTheme(e));
    ["all","popup","expo","culture"].forEach(k=>{
      const n = k==="all"?inRegion.length:inRegion.filter(e=>e.category===k).length;
      document.getElementById("n-"+k).textContent = n||"";
    });
    renderThemes(active.filter(e=>(cat==="all"||e.category===cat) && inReg(e,region) && inDist(e)));
    const inCat = active.filter(e=>(cat==="all"||e.category===cat) && inTheme(e));
    document.getElementById("n-r-all").textContent = inCat.length||"";
    ["seoul","gyeonggi","home","national"].forEach(k=>{
      const n = inCat.filter(e=>inReg(e,k)).length;
      document.getElementById("n-"+k).textContent = n||"";
    });
    renderDistricts(inCat);
    let list = inRegion.filter(e => cat==="all" || e.category===cat);
    if(onlyNew) list = list.filter(isNew);
    if(onlyRsv) list = list.filter(e => e.reservationUrl || e.reservationOpen || (e.reservation && !/예약 없음|현장 입장|현장 방문|무료, 현장/.test(e.reservation)));
    updateSummary(list.length);
    const main = document.getElementById("main");
    if(!list.length){
      main.innerHTML = `<div class="empty"><strong>${all.length?"조건에 맞는 행사가 없어요":"아직 모인 행사가 없어요"}</strong>${all.length?"다른 분야나 보기를 선택해 보세요.":"정기 알림이 실행될 때마다 찾은 행사가 여기에 쌓입니다."}</div>`;
      return;
    }
    const byStart = (a,b)=> (a.start||"9999").localeCompare(b.start||"9999");
    const hl = list.filter(e=>e.highlight).sort(byStart);
    const live = list.filter(e=>!e.highlight && e.start && e.start<=today).sort((a,b)=>(a.end||"").localeCompare(b.end||""));
    const up = list.filter(e=>!e.highlight && !(e.start && e.start<=today)).sort(byStart);
    let html = "";
    if(hl.length) html += `<h2 class="section-h">주목 <small>마감 임박 · 예약 오픈 임박</small></h2><div class="list">${hl.map(e=>card(e,today)).join("")}</div>`;
    if(live.length) html += `<h2 class="section-h">지금 진행 중 <small>종료일 빠른 순</small></h2><div class="list">${live.map(e=>card(e,today)).join("")}</div>`;
    if(up.length) html += `<h2 class="section-h">곧 열려요 <small>시작일 순</small></h2><div class="list">${up.map(e=>card(e,today)).join("")}</div>`;
    main.innerHTML = html;
  }

  document.querySelectorAll("[data-cat].chip").forEach(b=>b.addEventListener("click",()=>{
    cat=b.dataset.cat;
    document.querySelectorAll("[data-cat].chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    render();
  }));
  const REGION_LABEL = {seoul:"서울", gyeonggi:"경기도", home:"성남·광주·용인", national:"그 외 지역"};
  function updateSummary(n){
    const parts = [];
    if(cat!=="all") parts.push(CAT[cat]);
    if(theme!=="all") parts.push("#"+theme);
    if(region!=="all") parts.push(REGION_LABEL[region] + (region==="seoul" && district!=="all" ? " › "+district : ""));
    if(onlyNew) parts.push("새로 추가");
    if(onlyRsv) parts.push("사전예약");
    const sum = document.getElementById("fSummary");
    sum.innerHTML = parts.length ? parts.map(p=>`<b>${esc(p)}</b>`).join(" · ") : "전체 보기";
    document.getElementById("fCount").textContent = n + "개";
    document.getElementById("fReset").hidden = !parts.length;
  }
  const bar = document.querySelector(".bar"), panel = document.getElementById("fPanel"), fToggle = document.getElementById("fToggle");
  function setOpen(open, remember){
    panel.hidden = !open;
    bar.classList.toggle("collapsed", !open);
    fToggle.setAttribute("aria-expanded", String(open));
    if(remember){ try{ localStorage.setItem("filtersOpen", open ? "1" : "0"); }catch(_){} }
  }
  (function initOpen(){
    let saved = null;
    try{ saved = localStorage.getItem("filtersOpen"); }catch(_){}
    const narrow = window.matchMedia && window.matchMedia("(max-width: 640px)").matches;
    setOpen(saved===null ? !narrow : saved==="1", false);
  })();
  fToggle.addEventListener("click", ()=> setOpen(panel.hidden, true));
  document.getElementById("fReset").addEventListener("click", ()=>{
    cat="all"; theme="all"; region="all"; district="all"; onlyNew=false; onlyRsv=false;
    document.querySelectorAll("[data-cat].chip").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.cat==="all")));
    document.querySelectorAll("[data-region].chip").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.region==="all")));
    document.getElementById("v-new").setAttribute("aria-pressed","false");
    document.getElementById("v-rsv").setAttribute("aria-pressed","false");
    render();
  });
  function renderThemes(pool){
    const box = document.getElementById("themes");
    const counts = Object.fromEntries(THEME_NAMES.map(n=>[n, pool.filter(e=>themeOf(e)===n).length]));
    if(theme!=="all" && !counts[theme]) theme = "all";
    box.innerHTML = [["all","전체",pool.length]].concat(THEME_NAMES.filter(n=>counts[n]).map(n=>[n,n,counts[n]]))
      .map(([v,label,n])=>`<button class="chip" data-theme="${esc(v)}" aria-pressed="${v===theme}">${esc(label)}<span class="n">${n}</span></button>`).join("");
  }
  document.getElementById("themes").addEventListener("click", ev=>{
    const b = ev.target.closest("[data-theme]"); if(!b) return;
    theme = b.dataset.theme; render();
  });
  function renderDistricts(inCat){
    const box = document.getElementById("districts");
    const row = document.getElementById("districtRow");
    if(region!=="seoul"){ row.hidden = true; district = "all"; return; }
    const seoul = inCat.filter(e=>regionOf(e)==="seoul");
    const names = DISTRICTS.map(d=>d[0]).concat(["기타 서울"]);
    const counts = Object.fromEntries(names.map(n=>[n, seoul.filter(e=>districtOf(e)===n).length]));
    if(district!=="all" && !counts[district]) district = "all";
    box.innerHTML = [["all","서울 전체",seoul.length]].concat(names.filter(n=>counts[n]).map(n=>[n,n,counts[n]]))
      .map(([v,label,n])=>`<button class="chip" data-district="${esc(v)}" aria-pressed="${v===district}">${esc(label)}<span class="n">${n}</span></button>`).join("");
    row.hidden = false;
  }
  document.getElementById("districts").addEventListener("click", ev=>{
    const b = ev.target.closest("[data-district]"); if(!b) return;
    district = b.dataset.district; render();
  });
  document.querySelectorAll("[data-region].chip").forEach(b=>b.addEventListener("click",()=>{
    region=b.dataset.region; district="all";
    document.querySelectorAll("[data-region].chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    render();
  }));
  document.getElementById("v-new").addEventListener("click",e=>{onlyNew=!onlyNew;e.currentTarget.setAttribute("aria-pressed",String(onlyNew));render();});
  document.getElementById("v-rsv").addEventListener("click",e=>{onlyRsv=!onlyRsv;e.currentTarget.setAttribute("aria-pressed",String(onlyRsv));render();});

  const status = document.getElementById("status");
  (async()=>{
    try{
      const r = await fetch("events.json?t=" + Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const j = await r.json();
      all = Array.isArray(j.events) ? j.events : [];
      const latest = j.generatedAt || all.map(e=>e.updated||e.firstSeen||"").sort().pop();
      document.getElementById("lastUpd").textContent = latest ? "마지막 업데이트 " + new Date(latest).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
      status.textContent = "";
      render();
    }catch(err){ status.textContent = "목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요."; }
  })();
})();
</script>
</body>
</html>
